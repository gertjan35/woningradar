<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WoningRadar">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<title>WoningRadar</title>
<style>
  :root {
    --bg: #f5f7f7; --card: #fff; --text: #14201f; --muted: #5b6b69;
    --accent: #0f766e; --accent-text: #fff; --line: #dde5e4; --warn: #b45309;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0d1413; --card: #17201f; --text: #e8efee; --muted: #93a3a1;
            --accent: #2dd4bf; --accent-text: #062a26; --line: #26332f; --warn: #fbbf24; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         padding: env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom)); }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 16px 0 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px;
          padding: 14px 16px; margin-bottom: 12px; }
  .street { font-size: 20px; font-weight: 600; }
  .muted { color: var(--muted); font-size: 14px; }
  button { font: inherit; border: 0; border-radius: 12px; padding: 12px 16px; cursor: pointer; }
  .primary { background: var(--accent); color: var(--accent-text); width: 100%; font-weight: 600; }
  .secondary { background: transparent; color: var(--accent); padding: 8px 0; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { padding: 10px 0; border-top: 1px solid var(--line); }
  li:first-child { border-top: 0; }
  .price { font-weight: 700; }
  a { color: var(--accent); }
  label { display: block; margin: 10px 0 4px; font-size: 14px; color: var(--muted); }
  input { font: inherit; width: 100%; padding: 10px 12px; border-radius: 10px;
          border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  .error { color: var(--warn); font-size: 14px; margin-top: 8px; }
  #popup { position: fixed; left: 16px; right: 16px; top: calc(12px + env(safe-area-inset-top));
           max-width: 528px; margin: 0 auto; background: var(--accent); color: var(--accent-text);
           border-radius: 14px; padding: 14px 16px; box-shadow: 0 8px 30px rgba(0,0,0,.25);
           display: none; z-index: 10; }
  #popup a { color: inherit; font-weight: 600; }
  details summary { cursor: pointer; font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>WoningRadar</h1>

  <div class="card">
    <div class="muted">Je bent in</div>
    <div class="street" id="street">–</div>
    <div class="muted" id="status">Druk op Start om te beginnen.</div>
    <div class="error" id="error"></div>
  </div>

  <button class="primary" id="toggle">Start</button>

  <div class="card" style="margin-top:12px">
    <strong>Te koop binnen <span id="radiusLabel">100</span> m</strong>
    <div class="muted" id="quota"></div>
    <ul id="list"><li class="muted">Nog niets gevonden.</li></ul>
  </div>

  <details class="card" id="settings">
    <summary>Instellingen</summary>
    <label for="radius">Straal (meter)</label>
    <input id="radius" type="number" min="25" max="1000" step="25">
    <label for="token">Toegangscode (ACCESS_TOKEN van de server)</label>
    <input id="token" type="password" autocomplete="off">
    <label for="cacheHours">Een straat opnieuw zoeken na (uur)</label>
    <input id="cacheHours" type="number" min="1" max="168">
    <button class="secondary" id="notify">Meldingen toestaan</button>
    <button class="secondary" id="reset">Lijst en geheugen wissen</button>
  </details>
</main>

<div id="popup" role="alert"></div>
<script type="module" src="app.js"></script>
</body>
</html>
