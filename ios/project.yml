# XcodeGen-projectbestand. Maak het Xcode-project met:
#   brew install xcodegen && cd ios && xcodegen
name: WoningRadar
options:
  bundleIdPrefix: nl.woningradar
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""   # vul je Apple Team ID in, of kies het team in Xcode
targets:
  WoningRadar:
    type: application
    platform: iOS
    sources: [WoningRadar]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.woningradar.app
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: WoningRadar
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "WoningRadar gebruikt je locatie om te zien in welke straat je bent en welke woningen in de buurt te koop staan."
        INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: "Zo kan WoningRadar je ook een melding geven van woningen te koop als de app op de achtergrond staat."
    info:
      path: WoningRadar/Info.plist
      properties:
        UIBackgroundModes: [location]
